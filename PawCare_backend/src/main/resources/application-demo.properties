# Hosted demo profile (SPRING_PROFILES_ACTIVE=demo): in-memory H2 instead of MySQL.
# Sample providers, programmes and the admin account are seeded on every start,
# and anything submitted is cleared when the service restarts.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:pawcare;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
