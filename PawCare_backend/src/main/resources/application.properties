spring.application.name=PawCare_backend
server.port=${PORT:7681}

# DB Config (override with DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawcare_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: set JWT_SECRET (32+ characters). If unset, a random secret is generated at startup.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# CORS: comma-separated origin patterns allowed to call the API (the frontend runs on 6781)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:6781,http://127.0.0.1:6781}

# Admin account created on first start if it does not exist yet
app.admin.name=${ADMIN_NAME:PawCare Admin}
app.admin.email=${ADMIN_EMAIL:admin@pawcare.in}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Sample providers and courses are loaded into an empty database on first start
app.seed-demo-data=${SEED_DEMO_DATA:true}

# Content studio AI. Leave OPENAI_API_KEY empty to use the built-in template writer.
app.ai.openai-api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.timeout-seconds=40
