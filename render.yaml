# Render Blueprint: hosted demo of PawCare (API + frontend), free tier.
# The API runs with the "demo" profile on an in-memory database, so sample data
# is re-seeded on every start and nothing needs a MySQL server.
services:
  - type: web
    name: pawcare-api
    runtime: docker
    plan: free
    rootDir: PawCare_backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/providers/meta
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:6781
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: pawcare-web
    runtime: static
    rootDir: pawcare_frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
